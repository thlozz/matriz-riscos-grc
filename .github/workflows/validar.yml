name: Validar matriz de riscos
on:
  push:
  pull_request:
jobs:
  validar-planilha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar biblioteca de leitura
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Conferir estrutura sem modificar a planilha
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          caminho = Path("matriz_riscos_grc.xlsx")
          assert caminho.is_file(), "Planilha não encontrada"
          wb = load_workbook(caminho, data_only=False, read_only=False)
          for aba in ("Matriz de Riscos", "Mapa de Calor", "Metodologia"):
              assert aba in wb.sheetnames, f"Aba ausente: {aba}"
          ws = wb["Matriz de Riscos"]
          valores = [str(c.value).strip() for linha in ws.iter_rows() for c in linha if c.value is not None]
          for numero in range(1, 11):
              assert f"R-{numero:02d}" in valores, f"Risco R-{numero:02d} ausente"
          formulas = sum(1 for folha in wb for linha in folha.iter_rows()
                        for celula in linha if celula.data_type == "f")
          assert formulas > 0, "Fórmulas não encontradas"
          assert len(ws.data_validations.dataValidation) > 0, "Validações de dados ausentes"
          print(f"Planilha válida: {len(wb.sheetnames)} abas, {formulas} fórmulas.")
          PY
